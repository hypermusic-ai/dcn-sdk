[build-system]
requires = [
    "hatchling>=1.25",
    "hatch-vcs>=0.4",
    "openapi-python-client>=0.25,<0.29",
    "PyYAML>=6.0"
]
build-backend = "hatchling.build"

[project]
name = "decentralised-art"
description = "decentralised.art Python package"
readme = "README.md"
authors = [{ name = "decentralised.art" }]
license = { text = "BSD-2-Clause" }
requires-python = ">=3.9"
dependencies = [
    "hatchling>=1.27",
    "eth-account>=0.10",
    "pydantic>=2.6,<3",
    "httpx>=0.27,<1",
    "attrs>=23.1,<24",
    "python-dateutil>=1.4",
]
dynamic = ["version"]  # pulled from Git tag by hatch-vcs

[project.urls]
Homepage = "https://decentralised.art/"

[project.scripts]
decentralised-art-auth = "decentralised_art.cli:main"

[tool.hatch.version]
source = "vcs"   # derive version from tags like v0.1.0

[tool.hatch.build.hooks.vcs]
root = ".."
tag-pattern = "^v(?P<version>.*)$"
version-file = "decentralised_art/_version.py"   # optional but recommended for sdists

[tool.hatch.version.raw-options]
# The git repository is the parent of this package directory; without this the
# version silently falls back instead of coming from the release tag.
root = ".."
fallback_version = "0.0.0"

[tool.hatch.build.targets.wheel]
packages = ["decentralised_art", "decentralised_art.decentralised_art_api_client"]

# Ensure the whole tree is included even if Hatch didn't detect it as a package
[tool.hatch.build.targets.wheel.force-include]
"decentralised_art/decentralised_art_api_client" = "decentralised_art/decentralised_art_api_client"

[tool.hatch.build.targets.sdist]
# The generated client is git-ignored; ship it so the sdist installs without the
# api-spec submodule.
artifacts = ["decentralised_art/decentralised_art_api_client/**"]
include = [
    "decentralised_art/**",
    "pyproject.toml",
    "README.md",
    "scripts/bundle-openapi.py",
    "scripts/codegen.py",
]

[tool.hatch.build.hooks.custom]
path = "scripts/codegen.py"

[tool.hatch.metadata]
allow-direct-references = true

[project.optional-dependencies]
test = [
  "requests>=2.31",
  "coverage[toml]>=7.6",
  "flake8>=7.1",
  "mypy>=1.10",
  "openapi-python-client>=0.25,<0.29",
  "pyright>=1.1.390",
  "PyYAML>=6.0",
  "types-PyYAML>=6.0"
]

[tool.coverage.run]
branch = true
source = ["decentralised_art"]
omit = [
  "decentralised_art/decentralised_art_api_client/*",
  "decentralised_art/_version.py",
]

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true

[tool.pyright]
typeCheckingMode = "strict"
pythonVersion = "3.9"
include = ["decentralised_art", "scripts"]
exclude = ["decentralised_art/decentralised_art_api_client", "build"]

[tool.mypy]
strict = true
files = ["decentralised_art", "scripts"]
exclude = "decentralised_art/decentralised_art_api_client|build"

[[tool.mypy.overrides]]
module = "yaml"
ignore_missing_imports = true

[tool.hatch.envs.test]
features = ["test"]   # installs the [project.optional-dependencies].test extra

[tool.hatch.envs.test.scripts]
unit = "python scripts/codegen.py && python -m unittest discover -s tests -p 'test_*.py' -v"
coverage = "python scripts/codegen.py && coverage run -m unittest discover -s tests -p 'test_*.py' -v && coverage report"
lint = "flake8 decentralised_art scripts tests"
type = "python scripts/codegen.py && python -m pyright && python -m mypy"

[tool.hatch.envs.default.scripts]
codegen = "python scripts/codegen.py"
